[package]
name = "market-engine"
version = "0.1.0"
description = "Generic Market Engine - Prediction market with optional burn"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "market_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.0", features = ["init-if-needed"] }
anchor-spl = "0.30.0"
