[workspace]
members = [
    # Legacy programs
    "programs/problem-registry",
    "programs/direction-market",
    "programs/treasury",
    "programs/reputation",
    # Core programs (shared)
    "programs/subject-registry",
    "programs/market-engine",
    "programs/reputation-core",
    # Framing layers
    "programs/civic",
    "programs/creator",
]
resolver = "2"

[package]
name = "komon"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
# Patch blake3 to use 1.5.4 (edition 2021, depends on constant_time_eq 0.3.0)
blake3 = { path = "patches/blake3" }
